name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: |
          cd packages/extension
          npm install
          
      - name: Build extension
        run: |
          cd packages/extension
          npm run build
          
      - name: Zip extension
        run: |
          cd packages/extension/.wxt/dist/chrome-mv3
          zip -r ../../../../assix-browser-agent.zip .
          
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: assix-browser-agent
          path: packages/extension/assix-browser-agent.zip
